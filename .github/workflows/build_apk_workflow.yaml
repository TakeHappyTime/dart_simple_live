name: Build APK Only

on:
  workflow_dispatch:
  push:
    branches: [dev, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
          cache: true

      - name: 生成 local.properties（修复空值报错）
        run: |
          echo "sdk.dir=$ANDROID_HOME" > simple_live_app/android/local.properties
          echo "flutter.sdk=$FLUTTER_HOME" >> simple_live_app/android/local.properties
          echo "flutter.versionName=1.0.0" >> simple_live_app/android/local.properties
          echo "flutter.versionCode=1" >> simple_live_app/android/local.properties

      - name: 强制使用调试签名打包（无需签名文件）
        run: |
          sed -i 's/signingConfig signingConfigs\.release/signingConfig signingConfigs.debug/' simple_live_app/android/app/build.gradle.kts || true
          sed -i '/signingConfigs {/,/}/d' simple_live_app/android/app/build.gradle.kts || true

      - run: |
          cd simple_live_app
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_arm64
          path: simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_armeabi
          path: simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
