name: Build APK Only

on:
  workflow_dispatch:
  push:
    branches: [dev, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 禁用 Flutter 匿名统计
        run: flutter config --no-analytics

      - name: 安装 Android SDK Platform 36 和 NDK 28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "ndk;28.2.13676358"

      - name: 生成 local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > simple_live_app/android/local.properties
          echo "flutter.sdk=$FLUTTER_HOME" >> simple_live_app/android/local.properties

      - name: 覆写 build.gradle.kts
        run: |
          cat > simple_live_app/android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.simple_live"
              compileSdk = 36
              ndkVersion = "28.2.13676358"

              defaultConfig {
                  applicationId = "com.example.simple_live"
                  minSdk = 21
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: 修复 intl 版本冲突并安装依赖
        working-directory: ./simple_live_app
        run: |
          sed -i 's/intl:.*/intl: 0.19.0/' pubspec.yaml
          flutter pub get

      - name: 打包 APK
        working-directory: ./simple_live_app
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_app
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
